[package]
name = "raven-gui-build"
version = "0.1.3"
edition = "2018"
description = "Compiles the .xmlrs files of a crate (Raven XML + Rust) with ravenc, from build.rs"
license = "Apache-2.0"
repository = "https://github.com/oscar-soirey/Raven"
homepage = "https://github.com/oscar-soirey/Raven"
readme = "README.md"
keywords = ["gui", "ui", "raven", "build", "codegen"]
categories = ["gui", "development-tools::build-utils"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
# published as raven-gui-build, used as `raven_build` (raven_build::compile(...))
name = "raven_build"
path = "src/lib.rs"
